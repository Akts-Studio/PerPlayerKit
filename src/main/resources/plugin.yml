name: trKit
version: "${project.version}"
main: dev.noah.perplayerkit.TrKit
author: maskecikk
description: kitkitkitkit
website: https://github.com/themaskee
api-version: 1.21
folia-supported: true
softdepend:
  - PlaceholderAPI


permissions:
  kit.admin:
    children:
        perplayerkit.admin: true
  kit.staff:
    children:
        perplayerkit.staff: true
  kit.use:
    children:
      perplayerkit.use: true
  perplayerkit.use:
    children:
      perplayerkit.menu: true
      perplayerkit.copykit: true
      perplayerkit.sharekit: true
      perplayerkit.shareenderchest: true
      perplayerkit.swapkit: true
      perplayerkit.deletekit: true
      perplayerkit.publickit: true
      perplayerkit.kit: true
      perplayerkit.enderchest: true
      perplayerkit.viewenderchest: true
      perplayerkit.heal: true
      perplayerkit.repair: true
      perplayerkit.regear: true
      perplayerkit.rekitonrespawn: true
      perplayerkit.rekitonkill: true
      perplayerkit.kitbroadcast: true
      perplayerkit.rekit: true
      perplayerkit.kitroomopen: true
      perplayerkit.rekittoggle: true
  perplayerkit.kit.vip:
    description: Allows access to kit slots 5, 6, 7
    default: false
  perplayerkit.ec.vip:
    description: Allows access to EC slots 5, 6, 7
    default: false


commands:

  trkit:
    usage: /<command> (reload, vb.)
    permission: perplayerkit.admin
    aliases:
      - perplayerkit

  abouttrkit:
    usage: /<command>
    default: true

  kitroomadmin:
    usage: /<command>
    permission: perplayerkit.admin

  kit:
    usage: /<command>
    permission: perplayerkit.menu
    aliases: k

  copykit:
    usage: /<command>
    permission: perplayerkit.copykit
    aliases:
      - copyec
      - copyenderchest

  sharekit:
    usage: /<command>
    permission: perplayerkit.sharekit

  shareec:
    usage: /<command>
    permission: perplayerkit.shareenderchest
    aliases:
      - shareenderchest

  swapkit:
    usage: /<command>
    permission: perplayerkit.swapkit

  deletekit:
    usage: /<command>
    permission: perplayerkit.deletekit

  inspectkit:
    usage: /<command>
    permission: perplayerkit.staff

  inspectec:
    usage: /<command>
    permission: perplayerkit.staff

  publickit:
    usage: /<command>
    permission: perplayerkit.publickit
    aliases:
      - pk
      - premadekit

  k1:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit1
  k2:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit2
  k3:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit3
  k4:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit4
  k5:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit5
  k6:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit6
  k7:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit7
  k8:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit8
  k9:
    usage: /<command>
    permission: perplayerkit.kit
    aliases: kit9

  ec1:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest1
  ec2:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest2
  ec3:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest3
  ec4:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest4
  ec5:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest5
  ec6:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest6
  ec7:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest7
  ec8:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest8
  ec9:
    usage: /<command>
    permission: perplayerkit.enderchest
    aliases: enderchest9

  enderchest:
    usage: /<command>
    permission: perplayerkit.viewenderchest
    aliases: ec

  savepublickit:
    usage: /<command> <id>
    permission: perplayerkit.admin

  heal:
    usage: /<command>
    permission: perplayerkit.heal

  repair:
    usage: /<command>
    permission: perplayerkit.repair

  kitbroadcast:
    usage: /<command> [toggle|distance]
    permission: perplayerkit.kitbroadcast
    description: "Toggle kit broadcasts or set distance."

  rekit:
    usage: /<command>
    permission: perplayerkit.rekit
    description: "Son kullanılan kiti yeniler."
    aliases:
      - rk

  kitroom:
    usage: /<command>
    permission: perplayerkit.kitroomopen
    description: "Kit odasını açar."

  rekittoggle:
    usage: /<command> <death|kill>
    permission: perplayerkit.rekittoggle
    description: "Öldüğünde veya öldürdüğünde rekit toggle."
    aliases:
      - rt

  regear:
    usage: /<command>
    permission: perplayerkit.regear
    description: "Kiti regear yapar."
    aliases:
      - rg
