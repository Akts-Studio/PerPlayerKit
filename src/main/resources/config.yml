config-version: 1 # do not change this value


# Database credentials are only required if you are using MySQL or Redis
# It is strongly recommended to use MySQL or SQLite
# YAML should not be used in any environment

storage: # sqlite, mysql, redis, yml (yaml)
  type: sqlite

mysql:
  host: localhost
  port: '3306'
  dbname: kitdatabase
  username: username
  password: pa55w0rd
  useSSL: false
  maximumPoolSize: 10 # only change this if you know what your doing

redis:
  host: localhost
  port: 6379
  password: pa55w0rd

# Automatic backup settings for file-based storage (SQLite, YAML)
backup:
  enabled: true # Enable automatic backups for file-based storage methods
# Retention policy:
# - 1 backup per hour for the last 24 hours
# - 1 backup per day for the last 7 days
# - 1 backup per week for the last 30 days
# - 1 backup per month for the last 365 days
# Backups are stored in the plugins/PerPlayerKit/backups/ directory

motd:
  enabled: false
  delay: 5
  message: # join messages using mini message format
    - ''
    - <gray>   <st>                </st> <aqua><b>Per Player Kits</b><gray> <st>                </st>
    - ''
    - '         <white>Type <aqua>/kit<white>, <aqua>/k <white>or <aqua>/pk<white>
      to get started!'
    - ''
    - '<gray>   <st>                                                         '
    - ''

scheduled-broadcast: # uses mini message format
  enabled: false
  period: 90 # in seconds
  messages:
    - <white>Check out public kits with the <aqua>/pk<white> command!
    - <white>Want to share a kit? Use the <aqua>/sharekit <slot><white> command!
    - <white>Type <aqua>/kit<white>, <aqua>/k <white>or <aqua>/pk<white> to get started!

interface:
  glass-material: GRAY_STAINED_GLASS_PANE
  main-color: <green> # Plugin main color (MiniMessage format: <blue>, <red>, <green>, etc.)

kitroom:
  items:
    '1':
      name: '<#f527bb>ᴄʀʏꜱᴛᴀʟ'
      material: END_CRYSTAL
    '2':
      name: '<#dba34f>şᴀʙʟᴏɴʟᴀʀ'
      material: BOLT_ARMOR_TRIM_SMITHING_TEMPLATE
    '3':
      name:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
    '4':
      name: '<#474369>ᴢɪʀʜʟᴀʀ'
      material: NETHERITE_CHESTPLATE
    '5':
      name: '<#b0a9ae>ᴅɪğᴇʀ'
      material: SHIELD

disabled-command-worlds:
  - example_world

disabled-command-message: <red>Kits are disabled here!</red>


publickits:
  kit1:
    name: Kit 1
    icon: DIAMOND_SWORD

prefix: <green><b>mKit <gray>» <white>

use-display-name: true # For example, set to true if you want to display nicknames set by other plugins.

messages:
  disable-kit-messages: false # Set to true to disable all kit action messages (e.g. player loaded a kit, player repaired gear, etc.)
  player-repaired:
    enabled: true
    message: <gray>%player% repaired their gear</gray>
    permission: perplayerkit.kitnotify
  player-healed:
    enabled: true
    message: <gray>%player% healed themselves</gray>
    permission: perplayerkit.kitnotify
  player-opened-kit-room:
    enabled: true
    message: <gray>%player% opened the Kit Room</gray>
    permission: perplayerkit.kitnotify
  player-loaded-private-kit:
    enabled: true
    message: <gray>%player% loaded a kit</gray>
    permission: perplayerkit.kitnotify
  player-loaded-public-kit:
    enabled: true
    message: <gray>%player% loaded a public kit</gray>
    permission: perplayerkit.kitnotify
  player-loaded-enderchest:
    enabled: true
    message: <gray>%player% loaded an ender chest.</gray>
    permission: perplayerkit.kitnotify
  player-copied-kit:
    enabled: true
    message: <gray>%player% copied a kit</gray>
    permission: perplayerkit.kitnotify
  player-copied-ec:
    enabled: true
    message: <gray>%player% copied an ender chest</gray>
    permission: perplayerkit.kitnotify
  player-regeared:
    enabled: true
    message: <gray>%player% regeared</gray>
    permission: perplayerkit.kitnotify


anti-exploit:
  only-allow-kitroom-items: false # requires that items be in the kitroom before they can be used in a kit.
  import-filter: false # requires only-allow-kitroom-items to be true. prevents the duplications of items not in the kitroom by using the kit import button.
  block-spaces-in-commands: false # prevents bypassing command filters.
  prevent-shulkers-dropping-items: false # prevents shulkers from dropping items when broken. Anti-lag feature.
  blacklist: # items in this list will be removed from all kits
    - BEDROCK
    - BARRIER


regear:
  rg-mode: command # OPTIONS: command, shulker
  regear-mode: command # OPTIONS: command, shulker
  command-cooldown: 5 # command cooldown in seconds. recommended to be low or 0 if using shulker mode.
  damage-timer: 0 # time in seconds to wait after taking damage before players can regear
  allow-while-using-elytra: true # set false to block regearing command while using elytra
  prevent-putting-items-in-regear-inventory: false # set true to prevent putting items inside the regear shulker inventory
  #
  # Allow regearing all items by setting:
  # invert-whitelist: true
  # whitelist: []
  #
  #
  invert-whitelist: false # setting this to true makes the whitelist a blacklist
  whitelist:
    - ENDER_PEARL
    - END_CRYSTAL
    - OBSIDIAN
    - GLOWSTONE
    - SPLASH_POTION
    - NETHERITE_PICKAXE
    - NETHERITE_SWORD
    - SHIELD
    - NETHERITE_AXE
    - NETHERITE_PICKAXE
    - GOLDEN_APPLE
    - EXPERIENCE_BOTTLE
    - TIPPED_ARROW
    - CROSSBOW
    - BOW


# Various feature flags for the plugin
feature:
  set-health-on-kit-load: true
  set-hunger-on-kit-load: true
  set-saturation-on-kit-load: false
  remove-potion-effects-on-kit-load: false

  heal-on-enderchest-load: false
  feed-on-enderchest-load: false
  set-saturation-on-enderchest-load: false
  remove-potion-effects-on-enderchest-load: false

  heal-remove-effects: false # makes the /heal command remove potion effects in addition to healing

  rekit-on-respawn: false
  rekit-on-respawn-delay: 1 # in ticks (20 ticks = 1 second)
  rekit-on-kill: true
  rekit-on-kill-delay: 0 # in ticks (20 ticks = 1 second)

  broadcast-kit-messages: true # broadcasts when a player loads a kit (applies to both kits and enderchesets)

  broadcast-on-player-action: false # broadcasts when a player uses a kit, copies a kit, etc.


  old-death-drops: false # makes it so players drop items in a condensed area rather than spreading out when they die

broadcast-settings:
  default-enabled: true
  default-distance: 250
  distances:
    - 100
    - 150
    - 200
    - 250
  status-on: "&aAçık"
  status-off: "&cKapalı"

# Sound settings for plugin feedback
sounds:
  enabled: true
  # Sound played on successful actions (e.g. saving a kit)
  success: ENTITY_PLAYER_LEVELUP
  # Sound played on failed actions (e.g. attempting to use a disabled command)
  failure: ENTITY_ITEM_BREAK
  # Sound played when a button is clicked in a GUI
  click: UI_BUTTON_CLICK
  # Sound played when a GUI is opened
  open_gui: UI_BUTTON_CLICK
  # Sound played when a GUI is closed
  close_gui: UI_BUTTON_CLICK
